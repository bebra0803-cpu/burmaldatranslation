            color: #e5e5e5;
            font-size: 15px;

            min-height: 100px;
            transition: border-color 0.15s ease;

            border-color: #3b82f6;

            border: 1px solid #3a3a3a;
            background: #2a2a2a;
            color: #e5e5e5;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
            font-family: 'Inter', sans-serif;
            flex: 1;
            min-width: 80px;
            text-align: center;
        }

        .btn:hover {
            background: #333;
            border-color: #444;
        }

        .btn:active {
            background: #2a2a2a;
        }

        .stats {
            display: flex;
            gap: 24px;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid #333;
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 600;
            color: #e5e5e5;
        }

        .stat-label {
            font-size: 12px;
            color: #777;
        }

            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #3b82f6;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.25s ease;

            transition: max-height 0.25s ease, opacity 0.2s ease;

            margin-top: 0;

            color: #e5e5e5;
            font-size: 13px;
            font-family: 'Inter', sans-serif;

            outline: none;

            border-color: #3b82f6;
        }

        .history-search::placeholder {
            color: #555;
        }

            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;

            width: 6px;
        }

        .history-list::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 3px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        .history-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            cursor: pointer;
            transition: border-color 0.15s ease;

        }

            color: #888;
            font-size: 12px;
        }

        .history-item .h-target {
            color: #e5e5e5;
            font-size: 13px;
            font-weight: 500;
        }

            color: #555;
            font-size: 10px;

        .history-empty {
            color: #666;
            text-align: center;
            padding: 24px;
            font-size: 13px;

            color: #666;
            font-size: 11px;
            text-align: right;
            margin-top: 8px;

</head>

        <div class="translator-box">

                <textarea 
                    id="inputText" 
                    placeholder="Пиши сюда..."
                    autocomplete="off"
                    autocorrect="off"
                    spellcheck="false"

            </div>

            <div class="button-group">
                <button class="btn" id="reverseBtn">Поменять</button>
                <button class="btn" id="randomBtn">Рандом</button>
                <button class="btn" id="copyBtn">Копировать</button>
                <button class="btn" id="historyBtn">История</button>
                <button class="btn" id="clearBtn">Очистить</button>
            </div>

            <div class="input-group">
                <div class="label" id="outputLabel">Бурмалдатский</div>
                <textarea 
                    id="outputText" 
                    placeholder="Тут будет перевод..." 
                    readonly
                ></textarea>
            </div>

            <div class="history-panel" id="historyPanel">
                <input type="text" class="history-search" id="historySearch" placeholder="Поиск по истории...">
                <div class="history-list" id="historyList">
                    <div class="history-empty">История переводов пуста</div>
                </div>
                <div class="history-count" id="historyCount">Всего: 0</div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value" id="charCount">0</span>
                    <span class="stat-label">символов</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="wordCount">0</span>
                    <span class="stat-label">слов</span>
                </div>
            </div>
        </div>
    </div>

            "пизда", "пиздец", "пиздюк", "пиздеть", "пиздишь",
            "ебать", "ебал", "ебала", "ебали", "ебёт", "ебу",
            "ебанутый", "ебанный", "еблан", "ебло",
            "блядь", "блять", "бля", "блядина", "блядство",
            "сука", "суки", "суку",
            "ахуеть", "ахуел", "ахуела", "охуеть", "охуел",
            "заебал", "заебала", "заебало", "заебали",
            "уебок", "уебан", "уёбище",
            "гандон", "мудак", "мудила", "пидор", "пидорас",
            "хуесос", "хуеплёт", "долбоёб",
            "мразь", "тварь", "падла", "сволочь",
            "выебон", "выебываться", "проебал", "проебать",
            "наебать", "наебал", "разъебал", "разъебать",
            "въебать", "въебал", "отъебать", "отъебал",
            "подъебать", "подъебал", "съебать", "съебал",
            "ебанько", "ебануться", "ебанулся",
            "пизданутый", "пиздануть", "пизданул",
            "хуярить", "хуярит", "хуярил",
            "хули", "нах", "пох", "схуя", "схуяли",
        ]);

        const VERB_ENDINGS = [
            "ть", "ти", "чь", "тся", "ться",
            "ю", "ешь", "ет", "ем", "ете", "ют", "ут",
            "ишь", "ит", "им", "ите", "ат", "ят",
            "л", "ла", "ло", "ли",
            "й", "йте", "ь", "ься", "ся",
            "уй", "уйте", "ай", "айте", "ей", "ейте",
            "овал", "евала", "овало", "овали",
            "ывал", "ывала", "ывало", "ывали",
            "ивал", "ивала", "ивало", "ивали",
        ];

        const PARTICIPLE_ENDINGS = [
            "вший", "вшая", "вшее", "вшие",
            "щий", "щая", "щее", "щие",
            "нный", "нная", "нное", "нные",
            "тый", "тая", "тое", "тые",
            "ая", "яя", "ущий", "ющий",
            "ав", "авши", "ев", "евши",
            "я", "а", "учи", "ючи",
        ];

        let isReversed = false;

        // ==================== ХЕЛПЕРЫ ====================
        function pickRandom(value) {
            if (Array.isArray(value)) {
                return value[Math.floor(Math.random() * value.length)];
            }
            return value;
        }

        // ==================== ИСТОРИЯ ====================
        let history = [];
        const MAX_HISTORY = 50;
        let historyFilter = '';

        function loadHistory() {
            try {
                const saved = localStorage.getItem('burmaldat_history');
                if (saved) {
                    history = JSON.parse(saved);
                    renderHistory();
                }
            } catch(e) {}
        }

        function saveHistory() {
            try {
                localStorage.setItem('burmaldat_history', JSON.stringify(history));
            } catch(e) {}
        }

        function addToHistory(source, target) {
            if (!source.trim() || !target.trim()) return;
            if (history.length > 0 && history[0].source === source && history[0].target === target) return;
            
            history.unshift({
                source: source,
                target: target,
                time: new Date().toLocaleString('ru-RU')
            });
            
            if (history.length > MAX_HISTORY) {
                history = history.slice(0, MAX_HISTORY);
            }
            
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const filtered = history.filter(item => {
                const search = historyFilter.toLowerCase();
                return item.source.toLowerCase().includes(search) || 
                       item.target.toLowerCase().includes(search);
            });
            
            if (filtered.length === 0) {
                list.innerHTML = '<div class="history-empty">' + 
                    (history.length === 0 ? 'История переводов пуста' : 'Ничего не найдено') + 
                    '</div>';
            } else {
                list.innerHTML = filtered.map((item) => {
                    const realIndex = history.indexOf(item);
                    return `
                        <div class="history-item" data-index="${realIndex}">
                            <div class="h-source">${escapeHtml(item.source)}</div>
                            <div class="h-target">${escapeHtml(item.target)}</div>
                            <div class="h-time">${item.time}</div>
                        </div>
                    `;
                }).join('');
                
                list.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        const item = history[idx];
                        if (item) {
                            inputText.value = item.source;
                            translateText();
                            document.getElementById('historyPanel').classList.remove('open');
                        }
                    });
                });
            }
            
            document.getElementById('historyCount').textContent = 'Всего: ' + history.length;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleHistory() {
            const panel = document.getElementById('historyPanel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                document.getElementById('historySearch').focus();
            }
        }

        // ==================== ПЕРЕВОД ====================
        function isGreeting(word) { return GREETINGS.has(word.toLowerCase()); }
        function isQuestionWord(word) { return QUESTION_WORDS.has(word.toLowerCase()); }
        function isNoSuffixWord(word) { return NO_SUFFIX_WORDS.has(word.toLowerCase()); }
        function isSwearWord(word) { return SWEAR_WORDS.has(word.toLowerCase()); }

        function isPlural(word) {
            const lower = word.toLowerCase();
            const pluralEndings = [
                "ы", "и", "а", "я",
                "ов", "ев", "ей", "ий", "ых", "их",
                "ам", "ям",
                "ами", "ями", "ими", "ыми",
                "ах", "ях",
            ];
            const gerundEndings = ["авши", "евши", "учи", "ючи", "вши", "вша"];
            for (const ending of gerundEndings) {
                if (lower.endsWith(ending)) return false;
            }
            for (const ending of pluralEndings) {
                if (lower.endsWith(ending) && lower.length > ending.length + 2) {
                    return true;
                }
            }
            return false;
        }

        function isVerb(word) {
            const lower = word.toLowerCase();
            for (const ending of VERB_ENDINGS) {
                if (lower.endsWith(ending) && lower.length > ending.length + 1) return true;
            }
            if (lower.endsWith("ть") || lower.endsWith("ти") || lower.endsWith("чь")) return true;
            if (lower.match(/[а-яё]+л[аои]?$/i) && lower.length > 3) return true;
            if (lower.match(/[а-яё]+[юуеиая][тшщ]?$/i) && lower.length > 3) return true;
            return false;
        }

        function isParticipleOrGerund(word) {
            const lower = word.toLowerCase();
            for (const ending of PARTICIPLE_ENDINGS) {
                if (lower.endsWith(ending) && lower.length > ending.length + 1) return true;
            }
            return false;
        }

        function translateWord(word) {
            const isCapitalized = /^[А-ЯЁA-Z]/.test(word);
            const wordLower = word.toLowerCase();

            if (wordLower in REPLACEMENTS) {
                let result = pickRandom(REPLACEMENTS[wordLower]);
                if (isCapitalized) result = result.charAt(0).toUpperCase() + result.slice(1);
                return result;
            }

            if (isGreeting(wordLower)) return isCapitalized ? word : wordLower;
            if (isQuestionWord(wordLower)) return isCapitalized ? word : wordLower;
            if (isNoSuffixWord(wordLower)) return isCapitalized ? word : wordLower;
            if (isSwearWord(wordLower)) return isCapitalized ? word : wordLower;

            if (isPlural(wordLower)) {
                let stripped = wordLower.replace(/(ов|ев|ей|ий|ых|их|ам|ям|ами|ями|ими|ыми|ах|ях|ы|и|а|я)$/, '');
                if (stripped.length < 2) stripped = wordLower;
                const finalWord = stripped + "ности";
                return isCapitalized ? finalWord.charAt(0).toUpperCase() + finalWord.slice(1) : finalWord;
            }

            if (isVerb(wordLower)) return isCapitalized ? word : wordLower;
            if (isParticipleOrGerund(wordLower)) return isCapitalized ? word : wordLower;

            const wordStripped = wordLower.replace(/[аеёиоуыэюяьъ]$/, '');
            const finalWord = (wordStripped.length >= 2 ? wordStripped : wordLower) + "ность";
            return isCapitalized ? finalWord.charAt(0).toUpperCase() + finalWord.slice(1) : finalWord;
        }

        function reverseTranslateWord(word) {
            const isCapitalized = /^[А-ЯЁA-Z]/.test(word);
            const wordLower = word.toLowerCase();

            if (wordLower in REVERSE_REPLACEMENTS) {
                let result = REVERSE_REPLACEMENTS[wordLower];
                if (isCapitalized) result = result.charAt(0).toUpperCase() + result.slice(1);
                return result;
            }

            if (wordLower.endsWith("ности") && wordLower.length > 6) {
                let stripped = wordLower.slice(0, -4);
                if (isCapitalized) stripped = stripped.charAt(0).toUpperCase() + stripped.slice(1);
                return stripped + "ы";
            }
            if (wordLower.endsWith("ность") && wordLower.length > 6) {
                let stripped = wordLower.slice(0, -5);
                if (isCapitalized) stripped = stripped.charAt(0).toUpperCase() + stripped.slice(1);
                return stripped;
            }
            if (wordLower.endsWith("ость") && wordLower.length > 5) {
                let stripped = wordLower.slice(0, -4);
                if (isCapitalized) stripped = stripped.charAt(0).toUpperCase() + stripped.slice(1);
                return stripped;
            }
            return word;
        }

        // ==================== ГЛАВНАЯ ФУНКЦИЯ ПЕРЕВОДА ====================
        // Фразы заменяются на PUA-маркеры, чтобы их не переводили повторно
        function translateToBurmaldat(text) {
            // 1. Заменяем фразы на маркеры
            let result = text;
            const phraseStore = [];
            
            for (const { from, to } of PHRASES) {
                const escaped = from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escaped, 'gi');
                result = result.replace(regex, (match) => {
                    let translated = to;
                    if (/^[А-ЯЁA-Z]/.test(match)) {
                        translated = to.charAt(0).toUpperCase() + to.slice(1);
                    }
                    // Маркер: \uE000 + символ из \uE100-\uE1FF + \uE001
                    const marker = '\uE000' + String.fromCharCode(0xE100 + phraseStore.length) + '\uE001';
                    phraseStore.push(translated);
                    return marker;
                });
            }
            
            // 2. Переводим по словам
            const tokens = result.match(/[а-яА-ЯёЁa-zA-Z0-9]+|[^а-яА-ЯёЁa-zA-Z0-9]+/g) || [];
            const translated = tokens.map(token => {
                if (/[а-яА-ЯёЁa-zA-Z0-9]/.test(token)) {
                    return isReversed ? reverseTranslateWord(token) : translateWord(token);
                }
                return token;
            }).join('');
            
            // 3. Возвращаем фразы на место
            return translated.replace(/\uE000([\uE100-\uE1FF])\uE001/g, (_, ch) => 
                phraseStore[ch.charCodeAt(0) - 0xE100] || ''
            );
        }

        // ==================== РАНДОМ ====================
        const RANDOM_PHRASES = [
            "Привет, как дела? Что нового?",
            "Сегодня отличная погода, пойдем гулять!",
            "Я люблю учиться и узнавать новое.",
            "Кто-то сегодня очень вкусно пахнет.",
            "А давай сходим в кино на выходных?",
            "Мой кот самый лучший на свете.",
            "Вчера я приготовил вкусный ужин.",
            "Нужно купить хлеб и молоко.",
            "Лето — самое лучшее время года.",
            "Мы все когда-нибудь станем взрослыми.",
            "Ты слышал эту новую песню?",
            "Иногда хочется просто лежать и ничего не делать.",
            "Утром я выпил кофе и пошел на работу.",
            "В нашем городе открылся новый парк.",
            "Мне кажется, я видел тебя вчера.",
            "Давайте устроим вечеринку в пятницу!",
            "Счастье — это когда рядом близкие люди.",
            "Я уже почти закончил этот проект.",
            "Почему ты так долго не отвечал?",
            "Надо научиться радоваться мелочам.",
            "Книги — лучшие друзья человека.",
            "Завтра будет важная встреча.",
            "Спасибо за помощь, ты настоящий друг!",
            "У меня есть идея получше.",
            "Все будет хорошо, ты только верь.",
            "Мне снился страшный сон про зомби.",
            "На столе лежали книги и тетради.",
            "Дети играли во дворе с собакой.",
            "Сегодня я купил новый телефон.",
            "Вкусный обед согрел меня после долгой прогулки."
        ];

        function getRandomPhrase() {
            return RANDOM_PHRASES[Math.floor(Math.random() * RANDOM_PHRASES.length)];
        }

        function fillRandomText() {
            inputText.value = getRandomPhrase();
            translateText();
        }

        // ==================== UI ====================
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const charCount = document.getElementById('charCount');
        const wordCount = document.getElementById('wordCount');
        const notification = document.getElementById('notification');
        const directionLabel = document.getElementById('directionLabel');
        const directionArrow = document.getElementById('directionArrow');
        const inputLabel = document.getElementById('inputLabel');
        const outputLabel = document.getElementById('outputLabel');

        function updateDirectionUI() {
            if (isReversed) {
                directionLabel.textContent = 'Бурмалдатский → Русский';
                directionArrow.classList.add('reversed');
                inputLabel.textContent = 'Текст на бурмалдатском';
                outputLabel.textContent = 'Русский перевод';
                inputText.placeholder = 'Пиши по-бурмалдатски...';
                outputText.placeholder = 'Тут будет русский...';
            } else {
                directionLabel.textContent = 'Русский → Бурмалдатский';
                directionArrow.classList.remove('reversed');
                inputLabel.textContent = 'Текст на русском';
                outputLabel.textContent = 'Бурмалдатский';
                inputText.placeholder = 'Пиши сюда...';
                outputText.placeholder = 'Тут будет перевод...';
            }
        }

        function translateText() {
            const input = inputText.value;
            const output = translateToBurmaldat(input);
            outputText.value = output;
            
            const chars = input.replace(/\s/g, '').length;
            const words = input.trim() ? input.trim().split(/\s+/).length : 0;
            charCount.textContent = chars;
            wordCount.textContent = words;

            if (input.trim()) {
                addToHistory(input, output);
            }

            try { localStorage.setItem('burmaldat_input', input); } catch(e) {}
            try { localStorage.setItem('burmaldat_reversed', isReversed); } catch(e) {}
        }

        function toggleReverse() {
            isReversed = !isReversed;
            updateDirectionUI();
            
            const temp = inputText.value;
            inputText.value = outputText.value;
            outputText.value = temp;
            
            const input = inputText.value;
            const chars = input.replace(/\s/g, '').length;
            const words = input.trim() ? input.trim().split(/\s+/).length : 0;
            charCount.textContent = chars;
            wordCount.textContent = words;
            
            try { localStorage.setItem('burmaldat_input', inputText.value); } catch(e) {}
            try { localStorage.setItem('burmaldat_reversed', isReversed); } catch(e) {}
        }

        function copyText() {
            if (!outputText.value) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(outputText.value).then(showNotification);
            } else {
                outputText.select();
                document.execCommand('copy');
                showNotification();
            }
        }

        function clearAll() {
            inputText.value = '';
            outputText.value = '';
            charCount.textContent = '0';
            wordCount.textContent = '0';
            try { localStorage.removeItem('burmaldat_input'); } catch(e) {}
            inputText.focus();
        }

        function showNotification() {
            notification.classList.add('show');
            clearTimeout(notification._timeout);
            notification._timeout = setTimeout(() => notification.classList.remove('show'), 1800);
            if (navigator.vibrate) navigator.vibrate(30);
        }

        document.getElementById('reverseBtn').addEventListener('click', toggleReverse);
        document.getElementById('randomBtn').addEventListener('click', fillRandomText);
        document.getElementById('copyBtn').addEventListener('click', copyText);
        document.getElementById('clearBtn').addEventListener('click', clearAll);
        document.getElementById('historyBtn').addEventListener('click', toggleHistory);

        document.getElementById('historySearch').addEventListener('input', function() {
            historyFilter = this.value;
            renderHistory();
        });

        let debounceTimer;
        inputText.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(translateText, 150);
        });

        try {
            const savedReversed = localStorage.getItem('burmaldat_reversed');
            if (savedReversed === 'true') {
                isReversed = true;
                updateDirectionUI();
            }
            const saved = localStorage.getItem('burmaldat_input');
            if (saved) { inputText.value = saved; translateText(); }
        } catch(e) {}

        loadHistory();

        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'burmaldat-v19';
                const ASSETS = [self.location.href];
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS)));
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(caches.match(e.request).then(cached => cached || fetch(e.request)));
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }
    </script>
</body>
