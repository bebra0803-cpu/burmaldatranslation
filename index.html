<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Бурмалдат">
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%D0%91%D1%83%D1%80%D0%BC%D0%B0%D0%BB%D0%B4%D0%B0%D1%82%D1%81%D0%BA%D0%B8%D0%B9%20%D0%BF%D0%B5%D1%80%D0%B5%D0%B2%D0%BE%D0%B4%D1%87%D0%B8%D0%BA%22%2C%22short_name%22%3A%22%D0%91%D1%83%D1%80%D0%BC%D0%B0%D0%BB%D0%B4%D0%B0%D1%82%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231a1a2e%22%2C%22theme_color%22%3A%22%23e94560%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Crect%20width%3D'100'%20height%3D'100'%20rx%3D'20'%20fill%3D'%231a1a2e'%2F%3E%3Ctext%20x%3D'50'%20y%3D'65'%20font-size%3D'55'%20text-anchor%3D'middle'%20fill%3D'%23e94560'%20font-family%3D'Arial'%3E%D0%91%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22100x100%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%2C%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20512%20512'%3E%3Crect%20width%3D'512'%20height%3D'512'%20rx%3D'100'%20fill%3D'%231a1a2e'%2F%3E%3Ctext%20x%3D'256'%20y%3D'330'%20font-size%3D'280'%20text-anchor%3D'middle'%20fill%3D'%23e94560'%20font-family%3D'Arial'%20font-weight%3D'bold'%3E%D0%91%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
    
    <title>Бурмалдатский Переводчик</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        textarea { -webkit-user-select: text; user-select: text; }

        .particles {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(233, 69, 96, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            50% { transform: translateY(-100vh) translateX(100px) rotate(360deg); }
        }

        .container {
            position: relative; z-index: 1;
            width: 100%; max-width: 850px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(233, 69, 96, 0.1),
                        inset 0 0 60px rgba(233, 69, 96, 0.05);
        }

        @media (hover: hover) {
            .container:hover {
                transform: translateY(-5px);
                box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5),
                            0 0 0 1px rgba(233, 69, 96, 0.2),
                            inset 0 0 80px rgba(233, 69, 96, 0.08);
            }
        }

        .header { text-align: center; margin-bottom: 25px; }

        .title {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #e94560, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .translator-box { display: flex; flex-direction: column; gap: 18px; }

        .input-group { position: relative; }

        .label {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase;
        }

        .label-icon {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #e94560;
            box-shadow: 0 0 10px #e94560;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px #e94560; }
            50% { box-shadow: 0 0 25px #e94560, 0 0 50px #e94560; }
        }

        .output-label .label-icon {
            background: #ffd93d;
            box-shadow: 0 0 10px #ffd93d;
            animation: pulse-yellow 2s infinite;
        }

        @keyframes pulse-yellow {
            0%, 100% { box-shadow: 0 0 10px #ffd93d; }
            50% { box-shadow: 0 0 25px #ffd93d, 0 0 50px #ffd93d; }
        }

        textarea {
            width: 100%;
            padding: 18px 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            resize: vertical;
            min-height: 110px;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea:focus {
            border-color: #e94560;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        textarea::placeholder { color: rgba(255, 255, 255, 0.3); }

        #outputText {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 215, 0, 0.2);
        }

        #outputText:focus {
            border-color: #ffd93d;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .button-group {
            display: flex; gap: 10px;
            justify-content: center; flex-wrap: wrap;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 50px; border: none;
            font-size: 14px; font-weight: 700;
            letter-spacing: 0.8px; cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            position: relative; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            flex: 1; min-width: 90px; text-align: center;
        }

        .btn-reverse {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
            flex: 1.2;
        }

        @media (hover: hover) {
            .btn-reverse:hover {
                transform: translateY(-3px);
                box-shadow: 0 15px 40px rgba(108, 92, 231, 0.6);
            }
        }

        .btn-reverse:active { transform: scale(0.95); }

        .btn-copy {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        @media (hover: hover) {
            .btn-copy:hover {
                background: rgba(255, 255, 255, 0.2);
                border-color: #ffd93d;
                box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
                transform: translateY(-3px);
            }
        }

        .btn-random {
            background: linear-gradient(135deg, #fd79a8, #e17055);
            color: white;
            box-shadow: 0 10px 30px rgba(225, 112, 85, 0.4);
        }

        @media (hover: hover) {
            .btn-random:hover {
                transform: translateY(-3px);
                box-shadow: 0 15px 40px rgba(225, 112, 85, 0.6);
            }
        }

        .btn-random:active { transform: scale(0.95); }

        .btn-clear {
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            flex: 0.7;
        }

        @media (hover: hover) {
            .btn-clear:hover {
                color: white;
                border-color: rgba(255, 255, 255, 0.4);
                background: rgba(255, 255, 255, 0.05);
                transform: translateY(-3px);
            }
        }

        .btn-history {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            box-shadow: 0 10px 30px rgba(0, 206, 201, 0.3);
            flex: 0.8;
        }

        @media (hover: hover) {
            .btn-history:hover {
                transform: translateY(-3px);
                box-shadow: 0 15px 40px rgba(0, 206, 201, 0.5);
            }
        }

        .direction-indicator {
            display: flex; align-items: center;
            justify-content: center; gap: 8px;
            margin-bottom: 5px;
        }

        .direction-arrow {
            color: #ffd93d; font-size: 18px;
            transition: transform 0.4s ease;
        }

        .direction-arrow.reversed { transform: rotate(180deg); }

        .direction-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px; letter-spacing: 2px;
            text-transform: uppercase;
        }

        .copy-notification {
            position: fixed; top: 30px; left: 50%;
            transform: translateX(-50%) translateY(-150px);
            background: #ffd93d; color: #1a1a2e;
            padding: 15px 30px; border-radius: 50px;
            font-weight: 700; letter-spacing: 1px;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .copy-notification.show { transform: translateX(-50%) translateY(0); }

        .stats {
            display: flex; justify-content: center;
            gap: 30px; margin-top: 15px;
        }

        .stat-item { text-align: center; }

        .stat-value {
            font-size: 22px; font-weight: 700;
            color: #ffd93d;
        }

        .stat-label {
            font-size: 11px; color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px; text-transform: uppercase;
        }

        .history-panel {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.3s ease;
            opacity: 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px; margin-top: 0;
        }

        .history-panel.open {
            max-height: 450px; opacity: 1;
            margin-top: 15px; padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .history-search {
            width: 100%; padding: 10px 15px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff; font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 12px; outline: none;
            transition: all 0.3s ease;
        }

        .history-search:focus {
            border-color: #00cec9;
            box-shadow: 0 0 20px rgba(0, 206, 201, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .history-search::placeholder { color: rgba(255, 255, 255, 0.3); }

        .history-list {
            max-height: 320px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
        }

        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #e94560; border-radius: 4px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; padding: 12px 15px;
            display: flex; flex-direction: column; gap: 4px;
            cursor: pointer; transition: background 0.2s ease;
            border-left: 3px solid #e94560;
        }

        .history-item:hover { background: rgba(255, 255, 255, 0.08); }
        .history-item.hidden { display: none; }

        .history-item .h-source {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px; font-weight: 400;
        }

        .history-item .h-target {
            color: #fff; font-size: 14px; font-weight: 600;
        }

        .history-item .h-time {
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px; align-self: flex-end;
        }

        .history-empty {
            color: rgba(255, 255, 255, 0.3);
            text-align: center; padding: 30px; font-size: 14px;
        }

        .history-count {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px; text-align: right; margin-top: 5px;
        }

        .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
                padding-bottom: max(20px, env(safe-area-inset-bottom));
                padding-top: max(20px, env(safe-area-inset-top));
            }
        }

        @media (max-width: 768px) {
            .container { padding: 25px; border-radius: 25px; }
            .title { font-size: 36px; }
            .btn { padding: 11px 16px; font-size: 12px; min-width: 70px; }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }
            .container { padding: 18px; border-radius: 20px; }
            .header { margin-bottom: 20px; }
            .title { font-size: 26px; letter-spacing: 1px; }
            .translator-box { gap: 12px; }
            .label { font-size: 11px; letter-spacing: 0.5px; }
            textarea { font-size: 16px; padding: 14px; min-height: 90px; border-radius: 14px; }
            .button-group { gap: 6px; }
            .btn {
                padding: 10px 10px; font-size: 10px;
                letter-spacing: 0.3px; border-radius: 30px;
                min-width: 50px; flex: 1;
            }
            .btn-reverse { flex: 1.2; min-width: 60px; }
            .btn-clear { flex: 0.6; min-width: 45px; }
            .btn-history { flex: 0.8; min-width: 50px; }
            .stats { gap: 16px; margin-top: 12px; }
            .stat-value { font-size: 18px; }
            .stat-label { font-size: 9px; }
            .copy-notification { top: 15px; padding: 10px 20px; font-size: 13px; }
            .history-panel.open { padding: 10px; max-height: 350px; }
            .history-list { max-height: 240px; }
            .history-item { padding: 8px 12px; }
            .history-item .h-target { font-size: 12px; }
            .history-item .h-source { font-size: 10px; }
            .history-search { font-size: 12px; padding: 8px 12px; }
        }

        @media (max-width: 380px) {
            body { padding: 5px; padding-top: 15px; }
            .container { padding: 12px; border-radius: 15px; }
            .title { font-size: 22px; }
            .header { margin-bottom: 15px; }
            textarea { font-size: 15px; padding: 10px; min-height: 70px; border-radius: 10px; }
            .btn { padding: 8px 6px; font-size: 8px; min-width: 35px; letter-spacing: 0; }
            .label { font-size: 10px; }
            .stat-value { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="copy-notification" id="notification">Скопировано!</div>

    <div class="container">
        <div class="header">
            <h1 class="title">БУРМАЛДАТСКИЙ</h1>
            <div class="direction-indicator">
                <span class="direction-text" id="directionLabel">Русский → Бурмалдатский</span>
                <span class="direction-arrow" id="directionArrow">↓</span>
            </div>
        </div>

        <div class="translator-box">
            <div class="input-group">
                <div class="label">
                    <span class="label-icon"></span>
                    <span id="inputLabel">Текст на русском</span>
                </div>
                <textarea 
                    id="inputText" 
                    placeholder="Пиши сюда, бро..."
                    autocomplete="off"
                    autocorrect="off"
                    spellcheck="false"
                ></textarea>
            </div>

            <div class="button-group">
                <button class="btn btn-reverse" id="reverseBtn">Поменять</button>
                <button class="btn btn-random" id="randomBtn">Рандомный текст</button>
                <button class="btn btn-copy" id="copyBtn">Копировать</button>
                <button class="btn btn-history" id="historyBtn">История</button>
                <button class="btn btn-clear" id="clearBtn">Очистить</button>
            </div>

            <div class="input-group">
                <div class="label output-label">
                    <span class="label-icon"></span>
                    <span id="outputLabel">Бурмалдатский</span>
                </div>
                <textarea 
                    id="outputText" 
                    placeholder="Тут будет перевод..." 
                    readonly
                ></textarea>
            </div>

            <div class="history-panel" id="historyPanel">
                <input type="text" class="history-search" id="historySearch" placeholder="Поиск по истории...">
                <div class="history-list" id="historyList">
                    <div class="history-empty">История переводов пуста</div>
                </div>
                <div class="history-count" id="historyCount">Всего: 0</div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="charCount">0</div>
                    <div class="stat-label">символов</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="wordCount">0</div>
                    <div class="stat-label">слов</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== СЛОВАРЬ БУРМАЛДАТСКОГО ====================
        // Значения могут быть строкой или массивом строк (для случайного выбора)
        const REPLACEMENTS = {
            "я": "ч", "мне": "мье", "мы": "мч", "кто": "кьо",

            "то": "ьо", "да": "дэ",
            "лет": "тет", "сек": "чек", "пшо": "его",

            "дуб": "дур", "мод": "мож",
            "куколд": "Qcold", "обновление": "боновление",
            "хомяк": "хамям",
            "слов": "слоч",
            "суп": "рамен",
            "батя": "батч",
            "мама": "мом",
            "гулять": "БЛЯДЬ гулять",
            "смеяться": "сметанаяйца",
            "старался": "стараласт", "старалась": "стараласт",
            "кинула": "кикула", "было": "блыо",

            "естественно": "ест вест венно",

            "кажется": "калеттся",
            "лучше": ["луме", "гучше"],

            // ==================== НОВЫЕ СЛОВА ====================
            "хохочу": "хохляу",
            "можно": "могео",
            "будет": "будел",
            "босс": ["оосм", "госм", "гомс", "гсом", "Бро сс", "госмт", "долг", "додг", "готр", "бомс", "гочм", "юлосс"],
            "пора": "пона",
            "свету": "сверк",
            "показать": "покозать",
            "спасибо": "збозибо",
            "язык": "ягыр",
            "что": ["чло", "шьо"],
            "понял": ["поряг", "поояг"],
            "имба": "итба",
            "боже": "бозе",

        // ==================== ХЕЛПЕРЫ ====================
        function pickRandom(value) {
            if (Array.isArray(value)) {
                return value[Math.floor(Math.random() * value.length)];

        // ==================== ИСТОРИЯ ====================
        let history = [];
        const MAX_HISTORY = 50;
        let historyFilter = '';

        function loadHistory() {
            try {
                const saved = localStorage.getItem('burmaldat_history');
                if (saved) {
                    history = JSON.parse(saved);
                    renderHistory();
                }
            } catch(e) {}
        }

        function saveHistory() {
            try {
                localStorage.setItem('burmaldat_history', JSON.stringify(history));
            } catch(e) {}
        }

        function addToHistory(source, target) {
            if (!source.trim() || !target.trim()) return;
            if (history.length > 0 && history[0].source === source && history[0].target === target) return;
            
            history.unshift({
                source: source,
                target: target,
                time: new Date().toLocaleString('ru-RU')
            });
            
            if (history.length > MAX_HISTORY) {
                history = history.slice(0, MAX_HISTORY);
            }
            
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const filtered = history.filter(item => {
                const search = historyFilter.toLowerCase();
                return item.source.toLowerCase().includes(search) || 
                       item.target.toLowerCase().includes(search);
            });
            
            if (filtered.length === 0) {
                list.innerHTML = '<div class="history-empty">' + 
                    (history.length === 0 ? 'История переводов пуста' : 'Ничего не найдено') + 
                    '</div>';
            } else {
                list.innerHTML = filtered.map((item) => {
                    const realIndex = history.indexOf(item);
                    return `
                        <div class="history-item" data-index="${realIndex}">
                            <div class="h-source">${escapeHtml(item.source)}</div>
                            <div class="h-target">${escapeHtml(item.target)}</div>
                            <div class="h-time">${item.time}</div>
                        </div>
                    `;
                }).join('');
                
                list.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        const item = history[idx];
                        if (item) {
                            inputText.value = item.source;
                            translateText();
                            document.getElementById('historyPanel').classList.remove('open');
                        }
                    });
                });
            }
            
            document.getElementById('historyCount').textContent = 'Всего: ' + history.length;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;

        // ==================== ФУНКЦИИ ПЕРЕВОДА ====================
        function isGreeting(word) { return GREETINGS.has(word.toLowerCase()); }
        function isQuestionWord(word) { return QUESTION_WORDS.has(word.toLowerCase()); }
        function isNoSuffixWord(word) { return NO_SUFFIX_WORDS.has(word.toLowerCase()); }
        function isSwearWord(word) { return SWEAR_WORDS.has(word.toLowerCase()); }

        function isPlural(word) {
            const lower = word.toLowerCase();
            const pluralEndings = [
                "ы", "и", "а", "я",
                "ов", "ев", "ей", "ий", "ых", "их",
                "ам", "ям",
                "ами", "ями", "ими", "ыми",
                "ах", "ях",
            ];
            
            const gerundEndings = ["авши", "евши", "учи", "ючи", "вши", "вша"];
            for (const ending of gerundEndings) {
                if (lower.endsWith(ending)) return false;
            }
            
            for (const ending of pluralEndings) {
                if (lower.endsWith(ending) && lower.length > ending.length + 2) {
                    return true;
                }
            }
            return false;
        }

        function isVerb(word) {
            const lower = word.toLowerCase();
            for (const ending of VERB_ENDINGS) {
                if (lower.endsWith(ending) && lower.length > ending.length + 1) return true;
            }
            if (lower.endsWith("ть") || lower.endsWith("ти") || lower.endsWith("чь")) return true;
            if (lower.match(/[а-яё]+л[аои]?$/i) && lower.length > 3) return true;
            if (lower.match(/[а-яё]+[юуеиая][тшщ]?$/i) && lower.length > 3) return true;
            return false;
        }

        function isParticipleOrGerund(word) {
            const lower = word.toLowerCase();
            for (const ending of PARTICIPLE_ENDINGS) {
                if (lower.endsWith(ending) && lower.length > ending.length + 1) return true;
            }
            return false;
        }

        function translateWord(word) {
            const isCapitalized = /^[А-ЯЁA-Z]/.test(word);
            const wordLower = word.toLowerCase();

            if (wordLower in REPLACEMENTS) {
                let result = pickRandom(REPLACEMENTS[wordLower]);
                if (isCapitalized) result = result.charAt(0).toUpperCase() + result.slice(1);
                return result;
            }

            if (isGreeting(wordLower)) return isCapitalized ? word : wordLower;
            if (isQuestionWord(wordLower)) return isCapitalized ? word : wordLower;
            if (isNoSuffixWord(wordLower)) return isCapitalized ? word : wordLower;
            if (isSwearWord(wordLower)) return isCapitalized ? word : wordLower;

            if (isPlural(wordLower)) {
                let stripped = wordLower.replace(/(ов|ев|ей|ий|ых|их|ам|ям|ами|ями|ими|ыми|ах|ях|ы|и|а|я)$/, '');
                if (stripped.length < 2) stripped = wordLower;
                const finalWord = stripped + "ности";
                return isCapitalized ? finalWord.charAt(0).toUpperCase() + finalWord.slice(1) : finalWord;
            }

            if (isVerb(wordLower)) return isCapitalized ? word : wordLower;
            if (isParticipleOrGerund(wordLower)) return isCapitalized ? word : wordLower;

            const wordStripped = wordLower.replace(/[аеёиоуыэюяьъ]$/, '');
            const finalWord = (wordStripped.length >= 2 ? wordStripped : wordLower) + "ность";
            return isCapitalized ? finalWord.charAt(0).toUpperCase() + finalWord.slice(1) : finalWord;
        }

        function reverseTranslateWord(word) {
            const isCapitalized = /^[А-ЯЁA-Z]/.test(word);
            const wordLower = word.toLowerCase();

            if (wordLower in REVERSE_REPLACEMENTS) {
                let result = REVERSE_REPLACEMENTS[wordLower];
                if (isCapitalized) result = result.charAt(0).toUpperCase() + result.slice(1);
                return result;
            }

            if (wordLower.endsWith("ности") && wordLower.length > 6) {
                let stripped = wordLower.slice(0, -4);
                if (isCapitalized) stripped = stripped.charAt(0).toUpperCase() + stripped.slice(1);
                return stripped + "ы";
            }

            if (wordLower.endsWith("ность") && wordLower.length > 6) {
                let stripped = wordLower.slice(0, -5);
                if (isCapitalized) stripped = stripped.charAt(0).toUpperCase() + stripped.slice(1);
                return stripped;
            }

            if (wordLower.endsWith("ость") && wordLower.length > 5) {
                let stripped = wordLower.slice(0, -4);
                if (isCapitalized) stripped = stripped.charAt(0).toUpperCase() + stripped.slice(1);
                return stripped;
            }

            return word;
        }

        // Применяет фразовые правила (регистронезависимо)
        function applyPhrases(text) {
            let result = text;
            for (const { from, to } of PHRASES) {
                const escaped = from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escaped, 'gi');
                result = result.replace(regex, (match) => {
                    // Сохраняем регистр первой буквы
                    if (/^[А-ЯЁA-Z]/.test(match)) {
                        return to.charAt(0).toUpperCase() + to.slice(1);
                    }
                    return to;
                });
            }
            return result;
        }

        function translateToBurmaldat(text) {
            // Сначала фразовые правила
            const afterPhrases = applyPhrases(text);
            const tokens = afterPhrases.match(/[а-яА-ЯёЁa-zA-Z0-9]+|[^а-яА-ЯёЁa-zA-Z0-9]+/g) || [];
            return tokens.map(token => {
                if (/[а-яА-ЯёЁa-zA-Z0-9]/.test(token)) {
                    return isReversed ? reverseTranslateWord(token) : translateWord(token);
                }
                return token;
            }).join('');
        }

        function translateText() {
            const input = inputText.value;
            const output = translateToBurmaldat(input);
            outputText.value = output;
            
            const chars = input.replace(/\s/g, '').length;
            const words = input.trim() ? input.trim().split(/\s+/).length : 0;
            charCount.textContent = chars;
            wordCount.textContent = words;

            if (input.trim()) {
                addToHistory(input, output);

            try { localStorage.setItem('burmaldat_input', input); } catch(e) {}
            try { localStorage.setItem('burmaldat_reversed', isReversed); } catch(e) {}
        }

            charCount.textContent = chars;
            wordCount.textContent = words;
            
            try { localStorage.setItem('burmaldat_input', inputText.value); } catch(e) {}
            try { localStorage.setItem('burmaldat_reversed', isReversed); } catch(e) {}
        }

        function copyText() {
            if (!outputText.value) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(outputText.value).then(showNotification);
            } else {
                outputText.select();
                document.execCommand('copy');
                showNotification();
            }
        }

        function clearAll() {
            inputText.value = '';
            outputText.value = '';
            charCount.textContent = '0';
            wordCount.textContent = '0';
            try { localStorage.removeItem('burmaldat_input'); } catch(e) {}
            inputText.focus();
        }

        function showNotification() {
            notification.classList.add('show');
            clearTimeout(notification._timeout);
            notification._timeout = setTimeout(() => notification.classList.remove('show'), 2000);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // Обработчики событий
        document.getElementById('reverseBtn').addEventListener('click', toggleReverse);
        document.getElementById('randomBtn').addEventListener('click', fillRandomText);
        document.getElementById('copyBtn').addEventListener('click', copyText);
        document.getElementById('clearBtn').addEventListener('click', clearAll);
        document.getElementById('historyBtn').addEventListener('click', toggleHistory);

        document.getElementById('historySearch').addEventListener('input', function() {
            historyFilter = this.value;
            renderHistory();
        });

        let debounceTimer;
        inputText.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(translateText, 150);
        });

        // Ripple эффект
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('pointerdown', function(e) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Загрузка сохраненных данных
        try {
            const savedReversed = localStorage.getItem('burmaldat_reversed');
            if (savedReversed === 'true') {
                isReversed = true;
                updateDirectionUI();
            }
            const saved = localStorage.getItem('burmaldat_input');
            if (saved) { inputText.value = saved; translateText(); }
        } catch(e) {}

        loadHistory();

        // Частицы
        function createParticles() {
            const container = document.getElementById('particles');
            const count = window.innerWidth < 600 ? 15 : 30;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'burmaldat-v17';
                const ASSETS = [self.location.href];
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS)));
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(caches.match(e.request).then(cached => cached || fetch(e.request)));
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }
    </script>
</body>
</html>
